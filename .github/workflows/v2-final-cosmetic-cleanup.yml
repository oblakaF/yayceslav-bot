name: V2 final cosmetic cleanup

on:
  push:
    branches:
      - feature/human-yayceslav-v2

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run final cosmetic cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-yayceslav-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact cosmetic cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          state_path = Path('state_engine.py')
          state = state_path.read_text(encoding='utf-8')
          old_annoyed = '''    entry.annoyed_marked_at = current\n    entry.annoyed_marked_at = current\n    entry.annoyed_marked_at = current\n    entry.annoyed_marked_at = current\n'''
          new_annoyed = '''    entry.annoyed_marked_at = current\n'''
          if state.count(old_annoyed) != 1:
              raise SystemExit(f'annoyed duplicate block count={state.count(old_annoyed)}')
          state = state.replace(old_annoyed, new_annoyed, 1)

          old_argumentative = '''    entry.argumentative_marked_at = current\n    entry.argumentative_marked_at = current\n    entry.argumentative_marked_at = current\n    entry.argumentative_marked_at = current\n'''
          new_argumentative = '''    entry.argumentative_marked_at = current\n'''
          if state.count(old_argumentative) != 1:
              raise SystemExit(f'argumentative duplicate block count={state.count(old_argumentative)}')
          state = state.replace(old_argumentative, new_argumentative, 1)
          state_path.write_text(state, encoding='utf-8')

          bot_path = Path('bot.py')
          bot = bot_path.read_text(encoding='utf-8')
          old_message = '''    message = update.effective_message\n\n    message = update.effective_message\n'''
          new_message = '''    message = update.effective_message\n'''
          if bot.count(old_message) != 1:
              raise SystemExit(f'web-search message duplicate count={bot.count(old_message)}')
          bot = bot.replace(old_message, new_message, 1)
          bot_path.write_text(bot, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile bot.py personality.py intent.py humor_engine.py vocabulary.py style_engine.py voice_packs.py voice_runtime.py historical_packs.py social_engine.py aggression_engine.py reaction_engine.py passive_engine.py daily_title_engine.py state_engine.py title_pools.py
      - name: Test
        run: pytest -q
      - name: Commit tested cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py state_engine.py
          git commit -m "Clean duplicate V2 assignments"
          git push origin HEAD:feature/human-yayceslav-v2
