name: V2 bare follow-up search fix

on:
  push:
    branches:
      - fix/v2-bare-followup-no-search

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event.head_commit.message == 'Run bare follow-up search fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-bare-followup-no-search
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused fix
        run: python tools/apply_bare_followup_search_fix.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile bot.py thinking_engine.py personality.py intent.py humor_engine.py vocabulary.py style_engine.py voice_packs.py voice_runtime.py historical_packs.py social_engine.py aggression_engine.py reaction_engine.py passive_engine.py daily_title_engine.py state_engine.py title_pools.py
      - name: Focused regression
        run: pytest -q tests/test_auto_search_gate.py
      - name: Full regression
        run: pytest -q
      - name: Commit tested runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py tests/test_auto_search_gate.py
          git commit -m "Do not search on bare freshness follow-ups"
          git push origin HEAD:fix/v2-bare-followup-no-search
