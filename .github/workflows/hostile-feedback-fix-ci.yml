name: Hostile Feedback Fix CI

on:
  push:
    branches:
      - fix/hostile-brevity-reaction-feedback
    paths:
      - .tmp/run_hostile_feedback.marker

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply exact patch
        run: python .tmp/patch_hostile_feedback.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile
        run: >-
          python -m py_compile
          bot.py personality.py intent.py humor_engine.py vocabulary.py
          style_engine.py voice_packs.py voice_runtime.py verdict_engine.py historical_packs.py
          social_engine.py aggression_engine.py reaction_engine.py passive_engine.py
          daily_title_engine.py state_engine.py thinking_engine.py title_pools.py
          chat_native_engine.py feedback_engine.py humanizer_engine.py adaptation_cache.py
          hostile_streak_engine.py
      - name: Test
        run: pytest -q
      - name: Commit verified runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py style_engine.py voice_runtime.py tests/test_hostile_brevity_runtime.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix hostile escalation and feedback diagnostics"
          git push
