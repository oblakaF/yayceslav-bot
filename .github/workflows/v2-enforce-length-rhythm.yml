name: Enforce changing V2 answer length rhythm

on:
  push:
    branches:
      - feature/human-yayceslav-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Enforce changing V2 answer length rhythm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-yayceslav-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch length rhythm
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("style_engine.py")
          text = p.read_text(encoding="utf-8")

          old = '''    # Не запрещаем повтор полностью, но слегка меняем ритм даже после\n    # одного совпадения.\n    weights[last] *= 0.72\n'''
          new = '''    # Уже на этапе весов слегка отталкиваемся от предыдущей длины.\n    # Жёсткий запрет двух одинаковых классов подряд применяется ниже\n    # после первого случайного выбора.\n    weights[last] *= 0.72\n'''
          if text.count(old) != 1:
              raise SystemExit("history comment anchor mismatch")
          text = text.replace(old, new, 1)

          old = '''    category = _weighted_choice(weights, rng=rng)\n    min_chars, max_chars = _LENGTH_RANGES[category]\n'''
          new = '''    category = _weighted_choice(weights, rng=rng)\n\n    # Пользователь просил, чтобы длина реально менялась, а не просто\n    # имела немного другой шанс. Поэтому два соседних ответа одного\n    # чата не получают один и тот же класс длины, пока существует\n    # хотя бы одна допустимая альтернатива с ненулевым весом.\n    if history and category == history[-1]:\n        alternatives = dict(weights)\n        alternatives[history[-1]] = 0.0\n        if any(weight > 0 for weight in alternatives.values()):\n            category = _weighted_choice(alternatives, rng=rng)\n\n    min_chars, max_chars = _LENGTH_RANGES[category]\n'''
          if text.count(old) != 1:
              raise SystemExit("length choice anchor mismatch")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("tests/test_style_engine.py")
          t = test.read_text(encoding="utf-8")
          addition = '''\n\ndef test_consecutive_answers_never_use_same_length_class():\n    style_engine.reset_length_history()\n    ctx = style_engine.ResponseLengthContext(\n        user_text="обычный короткий вопрос",\n        conversation_mode="normal",\n    )\n    rng = random.Random(20260815)\n    categories = [\n        style_engine.choose_response_length(777, ctx, rng=rng).category\n        for _ in range(30)\n    ]\n    assert all(a != b for a, b in zip(categories, categories[1:]))\n\n\ndef test_target_length_still_varies_inside_classes():\n    style_engine.reset_length_history()\n    ctx = style_engine.ResponseLengthContext(\n        user_text="объясни обычную вещь",\n        conversation_mode="normal",\n    )\n    rng = random.Random(99)\n    plans = [style_engine.choose_response_length(778, ctx, rng=rng) for _ in range(20)]\n    assert len({plan.target_chars for plan in plans}) > 5\n'''
          if "test_consecutive_answers_never_use_same_length_class" not in t:
              test.write_text(t + addition, encoding="utf-8")
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Validate
        run: |
          python -m py_compile style_engine.py
          pytest -q
      - name: Commit tested code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style_engine.py tests/test_style_engine.py
          git commit -m "Enforce varied V2 answer length rhythm"
          git push origin HEAD:feature/human-yayceslav-v2
