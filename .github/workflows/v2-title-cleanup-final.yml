name: V2 title cleanup final

on:
  push:
    branches:
      - feature/human-yayceslav-v2

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run physical V2 title cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-yayceslav-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean legacy title block
        run: python scripts/clean_v2_titles.py
      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Validate
        run: |
          python -m py_compile vocabulary.py title_pools.py bot.py
          pytest -q
      - name: Commit cleaned vocabulary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vocabulary.py
          git commit -m "Remove legacy V1 title pools from V2 vocabulary"
          git push origin HEAD:feature/human-yayceslav-v2

# one-shot retry after narrowing cleanup boundary to /toast
