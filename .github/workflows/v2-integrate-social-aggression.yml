name: Integrate V2 social aggression runtime

on:
  push:
    branches:
      - feature/human-yayceslav-v2

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Integrate V2 social aggression runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-yayceslav-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              p = Path(path)
              data = p.read_bytes()
              nl = b"\r\n" if b"\r\n" in data else b"\n"
              old_b = old.replace("\n", nl.decode()).encode("utf-8")
              new_b = new.replace("\n", nl.decode()).encode("utf-8")
              count = data.count(old_b)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              p.write_bytes(data.replace(old_b, new_b, 1))

          patch(
              "bot.py",
              "import humor_engine\nimport intent\nimport style_engine\nimport voice_runtime\n",
              "import aggression_engine\nimport humor_engine\nimport intent\nimport social_engine\nimport style_engine\nimport voice_runtime\n",
              "imports",
          )

          patch(
              "bot.py",
              '''    recent_messages: list[str] | None = None,\n    bot_was_mentioned: bool = True,\n) -> str:\n''',
              '''    recent_messages: list[str] | None = None,\n    bot_was_mentioned: bool = True,\n    member_profile: dict[str, Any] | None = None,\n    user_id: int | None = None,\n) -> str:\n''',
              "build signature",
          )

          patch(
              "bot.py",
              '''        emotional_tone = intent.detect_emotional_tone(style_text)\n\n        voice_pack = style_engine.choose_voice_pack(\n''',
              '''        emotional_tone = intent.detect_emotional_tone(style_text)\n\n        social_ctx = social_engine.from_profile(member_profile)\n        if member_profile is not None:\n            social_instruction = social_engine.build_social_instruction(\n                social_ctx,\n                serious_topic=(conversation_mode == "serious"),\n            )\n            if social_instruction:\n                current_instruction += "\\n\\n" + social_instruction\n\n        voice_pack = style_engine.choose_voice_pack(\n''',
              "social context",
          )

          patch(
              "bot.py",
              '''            emotional_tone=emotional_tone,\n        )\n\n        tracker_chat_id = chat_id if chat_id is not None else 0\n''',
              '''            emotional_tone=emotional_tone,\n            relationship_level=social_ctx.relationship_level,\n        )\n\n        tracker_chat_id = chat_id if chat_id is not None else 0\n''',
              "relationship to humor",
          )

          patch(
              "bot.py",
              '''        if humor_instruction:\n            current_instruction += (\n                "\\n\\n"\n                + humor_instruction\n            )\n\n    if voice_style:\n''',
              '''        if humor_instruction:\n            current_instruction += (\n                "\\n\\n"\n                + humor_instruction\n            )\n\n        aggression_decision = aggression_engine.decide_aggression(\n            aggression_engine.AggressionContext(\n                user_text=style_text,\n                intent=resolved_intent,\n                confidence=intent_confidence,\n                chat_type=chat_type,\n                roughness=str(settings.get("roughness", "medium")),\n                relationship_level=social_ctx.relationship_level,\n                serious_topic=(conversation_mode == "serious"),\n                emotional_tone=emotional_tone,\n                recent_messages=tuple(recent_messages or ()),\n                chat_id=tracker_chat_id,\n                user_id=user_id or 0,\n            )\n        )\n        aggression_instruction = aggression_engine.build_aggression_instruction(\n            aggression_decision\n        )\n        if aggression_instruction:\n            current_instruction += aggression_instruction\n\n    if voice_style:\n''',
              "aggression runtime",
          )

          # ask_gemini: add user_id and fetch the already-existing profile asynchronously.
          patch(
              "bot.py",
              '''    recent_messages: list[str] | None = None,\n    bot_was_mentioned: bool = True,\n) -> str:\n    """Отправляет запрос Gemini с тремя попытками."""\n''',
              '''    recent_messages: list[str] | None = None,\n    bot_was_mentioned: bool = True,\n    user_id: int | None = None,\n) -> str:\n    """Отправляет запрос Gemini с тремя попытками."""\n''',
              "ask signature",
          )

          patch(
              "bot.py",
              '''    current_instruction = build_full_system_instruction(\n        style_text,\n        user_settings,\n        voice_style=voice_style,\n        chat_id=chat_id,\n        chat_type=chat_type,\n        user_name=user_name,\n        recent_messages=recent_messages,\n        bot_was_mentioned=bot_was_mentioned,\n    )\n''',
              '''    member_profile = None\n    if chat_id is not None and user_id is not None:\n        try:\n            member_profile = await get_member_profile(chat_id, user_id)\n        except Exception as profile_error:\n            logging.debug(\n                "Не удалось прочитать V2-профиль участника %s/%s: %s",\n                chat_id,\n                user_id,\n                profile_error,\n            )\n\n    current_instruction = build_full_system_instruction(\n        style_text,\n        user_settings,\n        voice_style=voice_style,\n        chat_id=chat_id,\n        chat_type=chat_type,\n        user_name=user_name,\n        recent_messages=recent_messages,\n        bot_was_mentioned=bot_was_mentioned,\n        member_profile=member_profile,\n        user_id=user_id,\n    )\n''',
              "profile fetch",
          )

          # Main text path passes the actual author id. Other call sites remain optional/neutral.
          patch(
              "bot.py",
              '''            user_name=request_user_name,\n            recent_messages=recent_messages_list,\n            bot_was_mentioned=True,\n        )\n''',
              '''            user_name=request_user_name,\n            recent_messages=recent_messages_list,\n            bot_was_mentioned=True,\n            user_id=(\n                update.effective_user.id\n                if update.effective_user\n                else None\n            ),\n        )\n''',
              "main text user id",
          )

          # V2 behavior-only descriptions for dormant humor types. No lexical pack mixing.
          patch(
              "bot.py",
              '''        if decision.should_be_self_ironic:\n            lines.append("Можно признать удачный подкол пользователя и ответить самоиронично.")\n        if decision.callback_reference:\n''',
              '''        behavior_hints = {\n            "irony": "Допустима сухая ирония по смыслу сообщения, без нового словаря.",\n            "hyperbole": "Можно один раз намеренно преувеличить ситуацию, коротко.",\n            "gaming_terminology": (\n                "Допустима игровая аналогия только если уже выбранный voice pack сам содержит игровой материал; "\n                "иначе передай идею без игровых слов."\n            ),\n            "deadpan_official": "Ответь нарочито сухо и официально, не переключаясь в operative-пакет.",\n            "anti_joke": "Можно дать намеренно приземлённый анти-панч вместо обычной шутки.",\n            "comic_refusal": "Можно комически поворчать, но реальный полезный ответ всё равно дай.",\n        }\n        behavior_hint = behavior_hints.get(decision.humor_type or "")\n        if behavior_hint:\n            lines.append(behavior_hint)\n        if decision.should_be_self_ironic:\n            lines.append("Можно признать удачный подкол пользователя и ответить самоиронично.")\n        if decision.callback_reference:\n''',
              "dormant behavior hints",
          )

          Path("tests/test_v2_social_aggression_runtime.py").write_text(
              '''import aggression_engine\nimport bot\nimport humor_engine\nimport style_engine\n\n\ndef test_member_profile_reaches_social_instruction():\n    style_engine.reset_length_history()\n    instruction = bot.build_full_system_instruction(\n        "что думаешь?",\n        chat_id=701,\n        chat_type="group",\n        user_id=77,\n        member_profile={\n            "relationship_level": 3,\n            "current_title": None,\n            "joke_archetype": None,\n            "total_messages": 120,\n        },\n    )\n    assert "хорошо знакомый участник" in instruction\n\n\ndef test_relationship_level_is_passed_to_humor_context(monkeypatch):\n    captured = {}\n\n    def fake_decide(ctx, chat_id):\n        captured["relationship_level"] = ctx.relationship_level\n        return humor_engine.HumorDecision(humor_allowed=False)\n\n    monkeypatch.setattr(bot.humor_engine, "decide_humor", fake_decide)\n    monkeypatch.setattr(\n        bot.aggression_engine,\n        "decide_aggression",\n        lambda ctx: aggression_engine.AggressionDecision(),\n    )\n    bot.build_full_system_instruction(\n        "обычная реплика",\n        chat_id=702,\n        chat_type="group",\n        user_id=78,\n        member_profile={"relationship_level": 4},\n    )\n    assert captured["relationship_level"] == 4\n\n\ndef test_aggression_instruction_is_appended_without_second_pack(monkeypatch):\n    monkeypatch.setattr(\n        bot.aggression_engine,\n        "decide_aggression",\n        lambda ctx: aggression_engine.AggressionDecision(\n            active=True,\n            mode="nitpick",\n            reason="test",\n        ),\n    )\n    instruction = bot.build_full_system_instruction(\n        "это точно факт",\n        chat_id=703,\n        chat_type="group",\n        user_id=79,\n        member_profile={"relationship_level": 2},\n    )\n    assert "V2 aggression/dokop" in instruction\n    assert instruction.count("Речевой пакет этого ответа:") == 1\n    assert "ТОЛЬКО из уже выбранного voice pack" in instruction\n\n\ndef test_serious_profile_does_not_add_social_or_aggression_jokes(monkeypatch):\n    monkeypatch.setattr(\n        bot.aggression_engine,\n        "decide_aggression",\n        lambda ctx: aggression_engine.AggressionDecision(),\n    )\n    instruction = bot.build_full_system_instruction(\n        "у меня умер родственник",\n        chat_id=704,\n        chat_type="group",\n        user_id=80,\n        member_profile={\n            "relationship_level": 4,\n            "current_title": "Лорд простыней",\n            "joke_archetype": "душнила",\n        },\n    )\n    assert "Лорд простыней" not in instruction\n    assert "душнила" not in instruction\n    assert "V2 aggression/dokop" not in instruction\n    assert "Речевой пакет этого ответа: classic" in instruction\n\n\ndef test_dormant_irony_type_has_behavior_hint_without_pack_switch():\n    decision = humor_engine.HumorDecision(\n        humor_allowed=True,\n        humor_type="irony",\n    )\n    instruction = bot._build_humor_instruction(\n        decision,\n        lexical_examples=False,\n    )\n    assert "сухая ирония" in instruction\n    assert "Не меняй и не дополняй" in instruction\n''',
              encoding="utf-8",
          )
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Validate
        run: |
          python -m py_compile bot.py personality.py intent.py humor_engine.py vocabulary.py style_engine.py voice_packs.py voice_runtime.py social_engine.py aggression_engine.py
          pytest -q
      - name: Commit tested code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py tests/test_v2_social_aggression_runtime.py
          git commit -m "Wire V2 social context and aggression"
          git push origin HEAD:feature/human-yayceslav-v2
