name: Free Serverless Audit

on:
  push:
    branches:
      - audit/free-serverless-20260816

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile all production modules
        run: >-
          python -m py_compile
          bot.py personality.py intent.py humor_engine.py vocabulary.py
          style_engine.py voice_packs.py voice_runtime.py verdict_engine.py historical_packs.py
          social_engine.py aggression_engine.py reaction_engine.py passive_engine.py
          daily_title_engine.py state_engine.py thinking_engine.py title_pools.py
          chat_native_engine.py feedback_engine.py humanizer_engine.py adaptation_cache.py
          hostile_streak_engine.py
      - name: Cold import memory
        run: |
          /usr/bin/time -v python -c "import bot; print('BOT_IMPORT_OK')" 2> memory.txt
          cat memory.txt
          python - <<'PY'
          import re
          text = open('memory.txt', encoding='utf-8').read()
          m = re.search(r'Maximum resident set size \(kbytes\):\s*(\d+)', text)
          assert m, text
          rss_kb = int(m.group(1))
          print(f'IMPORT_MAX_RSS_MB={rss_kb/1024:.1f}')
          assert rss_kb < 450 * 1024, f'cold import RSS too close to 512 MB limit: {rss_kb/1024:.1f} MB'
          PY
      - name: SQLite restart and feedback smoke
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import bot
          import feedback_engine

          with tempfile.TemporaryDirectory() as td:
              db = Path(td) / 'yayceslav_stats.db'
              bot.STATS_DB_PATH = db
              bot.initialize_stats_database()

              required = {
                  'stats', 'users', 'chats', 'user_settings', 'chat_settings',
                  'chat_member_profiles', 'chat_activity_daily',
                  'weekly_award_winners', 'daily_title_assignments',
                  'chat_native_terms', 'chat_native_term_users', 'chat_native_profiles',
                  'bot_response_feedback',
              }
              with bot.get_db_connection() as con:
                  tables = {r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              missing = required - tables
              assert not missing, f'missing tables: {sorted(missing)}'

              chat_id = -100777
              bot.update_chat_setting_sync(chat_id, 'hard_mode_enabled', False, 'group')
              bot.update_chat_setting_sync(chat_id, 'weekly_report_enabled', True, 'group')
              assert bot.get_chat_settings_sync(chat_id, 'group')['hard_mode_enabled'] is False
              assert bot.get_chat_settings_sync(chat_id, 'group')['weekly_report_enabled'] is True

              trace = feedback_engine.ResponseTrace(
                  chat_id=chat_id,
                  chat_type='group',
                  voice_pack='blat',
                  humor_type='layered_taunt',
                  verdict_used=False,
                  conversation_mode='hostile',
              )
              bot.store_bot_response_feedback_sync(chat_id, 12345, trace)
              assert bot.apply_bot_reaction_delta_sync(chat_id, 12345, 2.0, 1)

              # Simulated container restart: reopen/initialize the same persistent DB.
              bot.initialize_stats_database()
              settings = bot.get_chat_settings_sync(chat_id, 'group')
              assert settings['hard_mode_enabled'] is False
              assert settings['weekly_report_enabled'] is True
              with bot.get_db_connection() as con:
                  row = con.execute(
                      'SELECT voice_pack, reaction_score, reaction_count FROM bot_response_feedback WHERE chat_id=? AND message_id=?',
                      (chat_id, 12345),
                  ).fetchone()
              assert row == ('blat', 2.0, 1), row
              print('SQLITE_RESTART_FEEDBACK_OK')
          PY
      - name: Full test suite
        run: pytest -q
