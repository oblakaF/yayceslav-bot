name: Free Serverless Audit

on:
  push:
    branches:
      - test/free-serverless-audit-20260816

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      TELEGRAM_BOT_TOKEN: test-token
      GEMINI_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile all runtime modules
        run: >-
          python -m py_compile
          bot.py personality.py intent.py humor_engine.py vocabulary.py
          style_engine.py voice_packs.py voice_runtime.py verdict_engine.py historical_packs.py
          social_engine.py aggression_engine.py reaction_engine.py passive_engine.py
          daily_title_engine.py state_engine.py thinking_engine.py title_pools.py
          chat_native_engine.py feedback_engine.py humanizer_engine.py adaptation_cache.py
          hostile_streak_engine.py
      - name: Cold import
        run: python -c "import bot; print('COLD_IMPORT_OK', bot.STATS_DB_PATH)"
      - name: Full tests
        run: pytest -q
      - name: Restart and persistence audit
        run: pytest -q tests/test_free_serverless_restart_audit.py
