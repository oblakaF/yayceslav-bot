name: Add Gemini version command

on:
  push:
    branches:
      - agent/add-gemini-version-command

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-gemini-version-command

      - name: Patch bot.py
        shell: python
        run: |
          from pathlib import Path

          path = Path("bot.py")
          data = path.read_bytes()

          if b"async def gemini_version_command(" in data:
              raise SystemExit("gemini_version_command already exists")

          crlf = b"\r\n" if b"\r\n" in data else b"\n"

          startup_marker = (
              b"# ============================================================" + crlf
              + "# ЗАПУСК БОТА".encode("utf-8") + crlf
              + b"# ============================================================" + crlf
          )
          if data.count(startup_marker) != 1:
              raise SystemExit(f"Expected one startup marker, found {data.count(startup_marker)}")

          function_text = """async def gemini_version_command(
              update: Update,
              context: ContextTypes.DEFAULT_TYPE,
          ) -> None:
              \"\"\"Проверяет реальную модель Gemini через Google API.\"\"\"

              del context

              message = update.effective_message
              user = update.effective_user

              if not message or not user:
                  return

              if not BOT_OWNER_ID or user.id != BOT_OWNER_ID:
                  await message.reply_text(
                      \"Команда доступна только владельцу бота.\"
                  )
                  return

              try:
                  model_info = await asyncio.wait_for(
                      gemini_client.aio.models.get(
                          model=MODEL_NAME,
                      ),
                      timeout=20,
                  )

                  api_name = getattr(
                      model_info,
                      \"name\",
                      None,
                  ) or \"—\"
                  display_name = getattr(
                      model_info,
                      \"display_name\",
                      None,
                  ) or \"—\"
                  version = getattr(
                      model_info,
                      \"version\",
                      None,
                  ) or \"—\"
                  thinking = getattr(
                      model_info,
                      \"thinking\",
                      None,
                  )
                  input_limit = getattr(
                      model_info,
                      \"input_token_limit\",
                      None,
                  )
                  output_limit = getattr(
                      model_info,
                      \"output_token_limit\",
                      None,
                  )

                  await message.reply_text(
                      \"Gemini API: OK\\n\"
                      f\"Configured model: {MODEL_NAME}\\n\"
                      f\"API model: {api_name}\\n\"
                      f\"Display name: {display_name}\\n\"
                      f\"Version: {version}\\n\"
                      f\"Thinking supported: {thinking}\\n\"
                      f\"Input token limit: {input_limit}\\n\"
                      f\"Output token limit: {output_limit}\"
                  )

              except Exception as error:
                  logging.exception(
                      \"Ошибка проверки версии Gemini: %s\",
                      error,
                  )

                  await message.reply_text(
                      \"Gemini API: ERROR\\n\"
                      f\"Configured model: {MODEL_NAME}\\n\"
                      f\"{type(error).__name__}: {error}\"
                  )


          """
          function_bytes = function_text.replace("\n", crlf.decode()).encode("utf-8")
          data = data.replace(startup_marker, function_bytes + startup_marker, 1)

          old_handler = """    application.add_handler(
              CommandHandler(
                  \"stats\",
                  stats_command,
              )
          )
          """.replace("\n", crlf.decode()).encode("utf-8")

          new_handler = """    application.add_handler(
              CommandHandler(
                  \"stats\",
                  stats_command,
              )
          )
              application.add_handler(
              CommandHandler(
                  \"geminiversion\",
                  gemini_version_command,
              )
          )
          """.replace("\n", crlf.decode()).encode("utf-8")

          # Correct accidental indentation in the new handler block before insertion.
          new_handler = new_handler.replace(
              (crlf + b"        application.add_handler("),
              (crlf + b"    application.add_handler("),
              1,
          )

          if data.count(old_handler) != 1:
              raise SystemExit(f"Expected one stats handler, found {data.count(old_handler)}")
          data = data.replace(old_handler, new_handler, 1)

          path.write_bytes(data)

      - name: Verify Python and SDK compatibility
        run: |
          python -m py_compile bot.py
          python -m pip install --quiet google-genai==2.11.0
          python - <<'PY'
          from google import genai
          from google.genai import types

          client = genai.Client(api_key="test")
          assert hasattr(client.aio.models, "get")
          fields = types.Model.model_fields
          for field in (
              "name",
              "display_name",
              "version",
              "thinking",
              "input_token_limit",
              "output_token_limit",
          ):
              assert field in fields, field
          print("SDK model metadata fields: OK")
          PY
          grep -F '"geminiversion"' bot.py
          grep -F 'gemini_client.aio.models.get' bot.py
          grep -F 'user.id != BOT_OWNER_ID' bot.py

      - name: Commit command and remove temporary workflow
        run: |
          rm .github/workflows/add-gemini-version-command.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py .github/workflows/add-gemini-version-command.yml
          git commit -m "Add Gemini version admin command"
          git push origin HEAD:agent/add-gemini-version-command
