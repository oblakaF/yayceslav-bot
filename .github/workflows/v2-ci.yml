name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile
        run: >-
          python -m py_compile
          bot.py personality.py personality_architecture_v2_runtime.py mythic_rus_core_runtime.py canon_decision_runtime.py legacy_character_retirement_runtime.py persistent_tiered_memory_runtime.py unified_multimodal_context_runtime.py intent.py humor_engine.py vocabulary.py
          style_engine.py voice_packs.py voice_runtime.py voice2_runtime.py voice_live_bridge_runtime.py voice_live_bootstrap_hook.py verdict_engine.py historical_packs.py
          social_engine.py social_priority_runtime.py owner_social_diagnostics_runtime.py aggression_engine.py reaction_engine.py passive_engine.py
          positive_engine.py positive_runtime.py reputation_engine.py reputation_runtime.py reputation_daily_runtime.py
          daily_title_engine.py state_engine.py thinking_engine.py gemini_stability_runtime.py title_pools.py runtime_config.py schema_migrations.py
          chat_native_engine.py feedback_engine.py humanizer_engine.py adaptation_cache.py runtime_bootstrap.py
          hostile_streak_engine.py sticker_engine.py sticker_interaction.py sticker_runtime.py
          sticker_post_runtime.py sticker_tuning_runtime.py group_sticker_behavior_v2.py fight_mode_v2_tuning.py fight_patterns.py fight_routing_v3.py
          fight_memory_afterburner_v2.py fight_sticker_budget.py rage_pacing_runtime.py
          roast_lexicon.py roast_engine.py roast_engine_runtime.py
          primitive_compact_guard.py scoped_help_runtime.py command_menu.py
          member_profile_runtime.py member_repository.py dialogue_guard_runtime.py accountability_runtime.py
          member_memory_safety_patch.py claim_memory_v3.py dialogue_followup_mode_patch.py chat_member_updates_patch.py
          unified_daily_title_runtime.py relationship_experience_runtime.py relationship_memory_v2_runtime.py pairwise_relationship_runtime.py
          whoami_profile_v3_runtime.py whoami_profile_v4_runtime.py whoami_dynamic_verdict.py
          monthly_social_runtime.py monthly_report_timing_patch.py monthly_memory_scope_patch.py
          monthly_theme_quality_patch.py whoami_verdict_style_patch.py daily_content_runtime.py
          daily_content_source_patch.py praise_guard_runtime.py sticker_semantics_aug19.py
          rate_limit_tlen_runtime.py natural_router_runtime.py music_runtime.py lyrics_runtime.py music_lyrics_bridge_runtime.py music_recommendation_runtime.py music_recommendation_bootstrap_patch.py
          identity_recommendation_runtime.py book_recommendation_runtime.py movie_recommendation_runtime.py movie_seed_resolution_v2.py game_recommendation_runtime.py identity_recommendation_bootstrap_patch.py search_enrichment_runtime.py
          chat_digest_runtime.py date_grounding_runtime.py search_context_runtime.py entity_continuity_runtime.py search_slang_runtime.py
          lexical_search_v3.py evidence_grounding_runtime.py recent_video_note_runtime.py title_conflict_runtime.py
          imagination_runtime.py self_canon_runtime.py self_canon_v2_runtime.py
      - name: Test
        run: pytest -q