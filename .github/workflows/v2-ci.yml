name: V2 CI

on:
  push:
    branches:
      - feature/human-yayceslav-v2
  pull_request:
    branches:
      - feature/human-yayceslav

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile
        run: >-
          python -m py_compile
          bot.py personality.py intent.py humor_engine.py vocabulary.py
          style_engine.py voice_packs.py voice_runtime.py verdict_engine.py historical_packs.py
          social_engine.py aggression_engine.py reaction_engine.py passive_engine.py
          daily_title_engine.py state_engine.py thinking_engine.py title_pools.py
          chat_native_engine.py feedback_engine.py humanizer_engine.py adaptation_cache.py
          hostile_streak_engine.py sticker_engine.py sticker_interaction.py sticker_runtime.py
          sticker_post_runtime.py primitive_compact_guard.py scoped_help_runtime.py command_menu.py
          member_profile_runtime.py dialogue_guard_runtime.py member_memory_safety_patch.py
          dialogue_followup_mode_patch.py chat_member_updates_patch.py
      - name: Test
        run: pytest -q
