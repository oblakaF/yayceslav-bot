name: V2 audit final cleanup

on:
  push:
    branches:
      - feature/human-yayceslav-v2-audit-fixes

permissions:
  contents: write

concurrency:
  group: v2-audit-final-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run V2 final audit cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-yayceslav-v2-audit-fixes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cleanup
        run: python tools/apply_v2_final_audit_cleanup.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile bot.py humor_engine.py style_engine.py social_engine.py
      - name: Test
        run: pytest -q
      - name: Commit tested cleanup
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py humor_engine.py style_engine.py social_engine.py README.md tests/test_v2_final_audit_cleanup.py
          git commit -m "Finish V2 audit cleanup"
          git push origin HEAD:feature/human-yayceslav-v2-audit-fixes
