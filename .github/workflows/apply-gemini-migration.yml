name: Apply Gemini 3.6 migration

on:
  push:
    branches:
      - agent/update-gemini-3-6-flash

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-gemini-3-6-flash

      - name: Patch bot.py
        shell: python
        run: |
          from pathlib import Path

          path = Path("bot.py")
          data = path.read_bytes()

          old_model = b'MODEL_NAME = "gemini-3.1-flash-lite"'
          new_model = b'MODEL_NAME = "gemini-3.6-flash"'
          if data.count(old_model) != 1:
              raise SystemExit(f"Expected exactly one old model declaration, found {data.count(old_model)}")
          data = data.replace(old_model, new_model, 1)

          crlf_old = b'                            temperature=0.9,\r\n'
          crlf_new = (
              b'                            thinking_config=types.ThinkingConfig(\r\n'
              b'                                thinking_level="medium",\r\n'
              b'                            ),\r\n'
          )
          lf_old = b'                            temperature=0.9,\n'
          lf_new = (
              b'                            thinking_config=types.ThinkingConfig(\n'
              b'                                thinking_level="medium",\n'
              b'                            ),\n'
          )

          if data.count(crlf_old) == 1:
              data = data.replace(crlf_old, crlf_new, 1)
          elif data.count(lf_old) == 1:
              data = data.replace(lf_old, lf_new, 1)
          else:
              raise SystemExit("Expected exactly one temperature=0.9 line")

          path.write_bytes(data)

      - name: Verify migration
        run: |
          python -m py_compile bot.py
          grep -F 'MODEL_NAME = "gemini-3.6-flash"' bot.py
          grep -F 'thinking_level="medium"' bot.py
          if grep -F 'temperature=0.9' bot.py; then
            echo "Deprecated temperature setting is still present"
            exit 1
          fi

      - name: Commit migration and remove temporary workflow
        run: |
          rm .github/workflows/apply-gemini-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py .github/workflows/apply-gemini-migration.yml
          git diff --cached --check
          git commit -m "Update Gemini to 3.6 Flash"
          git push origin HEAD:agent/update-gemini-3-6-flash
