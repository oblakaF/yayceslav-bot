name: Adaptation final verification

on:
  push:
    branches:
      - feature/chat-adaptation-v2

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.event.head_commit.message == 'Run adaptation final verification'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-adaptation-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Apply final cache patch
        run: python tools/apply_adaptation_final_cache.py

      - name: Compile
        run: >-
          python -m py_compile
          bot.py personality.py intent.py humor_engine.py vocabulary.py
          style_engine.py voice_packs.py voice_runtime.py verdict_engine.py historical_packs.py
          social_engine.py aggression_engine.py reaction_engine.py passive_engine.py
          daily_title_engine.py state_engine.py thinking_engine.py title_pools.py
          chat_native_engine.py feedback_engine.py humanizer_engine.py adaptation_cache.py

      - name: Test
        run: pytest -q

      - name: Commit verified runtime cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Cache adaptive chat personality reads"
          git push origin HEAD:feature/chat-adaptation-v2
