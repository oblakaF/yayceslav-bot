name: V2 final static audit

on:
  push:
    branches:
      - feature/human-yayceslav-v2-audit-fixes

jobs:
  audit:
    if: github.event.head_commit.message == 'Run final V2 static audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-yayceslav-v2-audit-fixes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static audit
        run: python tools/final_static_audit.py
