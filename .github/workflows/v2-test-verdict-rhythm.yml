name: Test human verdict and taunt rhythm

on:
  push:
    branches:
      - fix/human-verdict-taunt-rhythm

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile bot.py personality.py intent.py humor_engine.py vocabulary.py style_engine.py voice_packs.py voice_runtime.py verdict_engine.py historical_packs.py social_engine.py aggression_engine.py reaction_engine.py passive_engine.py daily_title_engine.py state_engine.py thinking_engine.py title_pools.py
      - name: Focused tests
        run: pytest -q tests/test_voice_runtime.py tests/test_verdict_engine.py
      - name: Full regression
        run: pytest -q
