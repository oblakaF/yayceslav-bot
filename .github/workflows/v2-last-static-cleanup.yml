name: V2 last static cleanup

on:
  push:
    branches:
      - feature/human-yayceslav-v2-audit-fixes

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run final V2 static cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-yayceslav-v2-audit-fixes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cleanup
        run: python tools/apply_last_static_cleanup.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile bot.py
      - name: Test
        run: pytest -q
      - name: Commit tested cleanup
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py tests/test_v2_last_static_cleanup.py
          git commit -m "Finish V2 static cleanup"
          git push origin HEAD:feature/human-yayceslav-v2-audit-fixes
