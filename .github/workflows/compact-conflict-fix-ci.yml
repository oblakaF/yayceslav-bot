name: Compact Conflict Fix CI

on:
  push:
    branches:
      - fix/hostile-compact-old-russian-weight
    paths:
      - .tmp/run_compact_conflict.marker

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply exact patch
        run: |
          python .tmp/patch_compact_conflict.py
          python .tmp/patch_compact_conflict_fix2.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile
        run: >-
          python -m py_compile
          bot.py style_engine.py humanizer_engine.py hostile_streak_engine.py
          feedback_engine.py voice_runtime.py
      - name: Test
        run: pytest -q
      - name: Commit verified runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py style_engine.py humanizer_engine.py hostile_streak_engine.py tests/test_compact_conflict_humanizer.py
          git diff --cached --quiet && exit 0
          git commit -m "Tighten conflict rhythm and reduce old Russian weight"
          git push
