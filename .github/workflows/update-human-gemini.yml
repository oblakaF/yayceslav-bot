name: Update human Yayceslav Gemini

on:
  push:
    branches:
      - agent/human-gemini-3-6-version

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/human-gemini-3-6-version

      - name: Patch bot.py
        shell: python
        run: |
          from pathlib import Path

          path = Path("bot.py")
          text = path.read_text(encoding="utf-8")

          old_model = 'MODEL_NAME = "gemini-3.1-flash-lite"'
          new_model = 'MODEL_NAME = "gemini-3.6-flash"'
          if text.count(old_model) != 1:
              raise SystemExit(f"Expected one old model declaration, found {text.count(old_model)}")
          text = text.replace(old_model, new_model, 1)

          old_config = '''                        config=types.GenerateContentConfig(
                            system_instruction=current_instruction,
                            max_output_tokens=max_output_tokens,
                            temperature=0.9,
                        ),'''
          new_config = '''                        config=types.GenerateContentConfig(
                            system_instruction=current_instruction,
                            max_output_tokens=max_output_tokens,
                            thinking_config=types.ThinkingConfig(
                                thinking_level="medium",
                            ),
                        ),'''
          if text.count(old_config) != 1:
              raise SystemExit(f"Expected one old Gemini config, found {text.count(old_config)}")
          text = text.replace(old_config, new_config, 1)

          if "async def gemini_version_command(" in text:
              raise SystemExit("gemini_version_command already exists")

          startup_marker = '''# ============================================================
          # ЗАПУСК БОТА
          # ============================================================
          '''
          if text.count(startup_marker) != 1:
              raise SystemExit(f"Expected one startup marker, found {text.count(startup_marker)}")

          function_text = '''async def gemini_version_command(
              update: Update,
              context: ContextTypes.DEFAULT_TYPE,
          ) -> None:
              """Проверяет реальную модель Gemini через Google API."""

              del context

              message = update.effective_message
              user = update.effective_user

              if not message or not user:
                  return

              # Как и /stats: посторонним ничего не раскрываем.
              if (
                  BOT_OWNER_ID == 0
                  or user.id != BOT_OWNER_ID
              ):
                  return

              try:
                  model_info = await asyncio.wait_for(
                      gemini_client.aio.models.get(
                          model=MODEL_NAME,
                      ),
                      timeout=20,
                  )

                  api_name = getattr(model_info, "name", None) or "—"
                  display_name = getattr(model_info, "display_name", None) or "—"
                  version = getattr(model_info, "version", None) or "—"
                  thinking = getattr(model_info, "thinking", None)
                  input_limit = getattr(model_info, "input_token_limit", None)
                  output_limit = getattr(model_info, "output_token_limit", None)

                  await message.reply_text(
                      "Gemini API: OK\n"
                      f"Configured model: {MODEL_NAME}\n"
                      f"API model: {api_name}\n"
                      f"Display name: {display_name}\n"
                      f"Version: {version}\n"
                      f"Thinking supported: {thinking}\n"
                      f"Input token limit: {input_limit}\n"
                      f"Output token limit: {output_limit}"
                  )

              except Exception as error:
                  logging.exception(
                      "Ошибка проверки версии Gemini: %s",
                      error,
                  )

                  await message.reply_text(
                      "Gemini API: ERROR\n"
                      f"Configured model: {MODEL_NAME}\n"
                      f"{type(error).__name__}: {error}"
                  )


          '''
          text = text.replace(startup_marker, function_text + startup_marker, 1)

          settings_handler = '''    application.add_handler(
              CommandHandler(
                  "settings",
                  settings_command,
              )
          )
          '''
          version_handler = '''    application.add_handler(
              CommandHandler(
                  "geminiversion",
                  gemini_version_command,
              )
          )
          '''
          if text.count(settings_handler) != 1:
              raise SystemExit(f"Expected one settings handler, found {text.count(settings_handler)}")
          text = text.replace(settings_handler, version_handler + settings_handler, 1)

          path.write_text(text, encoding="utf-8")

      - name: Install test dependencies
        run: python -m pip install --quiet -r requirements-dev.txt

      - name: Verify code and SDK
        run: |
          python -m py_compile bot.py personality.py humor_engine.py intent.py vocabulary.py
          python - <<'PY'
          from google import genai
          from google.genai import types

          client = genai.Client(api_key="test")
          assert hasattr(client.aio.models, "get")
          fields = types.Model.model_fields
          for field in (
              "name",
              "display_name",
              "version",
              "thinking",
              "input_token_limit",
              "output_token_limit",
          ):
              assert field in fields, field
          print("Gemini SDK metadata support: OK")
          PY
          grep -F 'MODEL_NAME = "gemini-3.6-flash"' bot.py
          grep -F 'thinking_level="medium"' bot.py
          ! grep -F 'temperature=0.9' bot.py
          grep -F '"geminiversion"' bot.py

      - name: Run full test suite
        run: pytest -q

      - name: Commit update and remove temporary workflow
        run: |
          rm .github/workflows/update-human-gemini.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py .github/workflows/update-human-gemini.yml
          git commit -m "Update human Yayceslav to Gemini 3.6 Flash"
          git push origin HEAD:agent/human-gemini-3-6-version
