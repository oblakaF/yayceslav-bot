name: Clean adaptation verification

on:
  push:
    branches:
      - feature/chat-adaptation-v2

jobs:
  verify:
    if: github.event.head_commit.message == 'Run clean adaptation verification'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-adaptation-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile
        run: >-
          python -m py_compile
          bot.py personality.py intent.py humor_engine.py vocabulary.py
          style_engine.py voice_packs.py voice_runtime.py verdict_engine.py historical_packs.py
          social_engine.py aggression_engine.py reaction_engine.py passive_engine.py
          daily_title_engine.py state_engine.py thinking_engine.py title_pools.py
          chat_native_engine.py feedback_engine.py humanizer_engine.py adaptation_cache.py
      - name: Test
        run: pytest -q
