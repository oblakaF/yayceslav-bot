name: Apply latest main Gemini settings

on:
  push:
    branches:
      - feature/rage-consistency-punches

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rage-consistency-punches
          fetch-depth: 0

      - name: Patch bot.py with main-only Gemini changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot.py')
          raw = path.read_bytes().decode('utf-8')
          newline = '\r\n' if '\r\n' in raw else '\n'
          text = raw.replace('\r\n', '\n')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'MODEL_NAME = "gemini-3.1-flash-lite"',
              'MODEL_NAME = "gemini-3.6-flash"',
              'model name',
          )

          replace_once(
              '''                        config=types.GenerateContentConfig(
                            system_instruction=current_instruction,
                            max_output_tokens=max_output_tokens,
                            temperature=0.9,
                        ),''',
              '''                        config=types.GenerateContentConfig(
                            system_instruction=current_instruction,
                            max_output_tokens=max_output_tokens,
                            thinking_config=types.ThinkingConfig(
                                thinking_level="medium",
                            ),
                        ),''',
              'thinking config',
          )

          marker = '''# ============================================================
# ЗАПУСК БОТА
# ============================================================
'''
          command = '''async def gemini_version_command(
    update: Update,
    context: ContextTypes.DEFAULT_TYPE,
) -> None:
    """Проверяет реальную модель Gemini через Google API."""

    del context

    message = update.effective_message
    user = update.effective_user

    if not message or not user:
        return

    if not BOT_OWNER_ID or user.id != BOT_OWNER_ID:
        await message.reply_text(
            "Команда доступна только владельцу бота."
        )
        return

    try:
        model_info = await asyncio.wait_for(
            gemini_client.aio.models.get(
                model=MODEL_NAME,
            ),
            timeout=20,
        )

        api_name = getattr(model_info, "name", None) or "—"
        display_name = getattr(model_info, "display_name", None) or "—"
        version = getattr(model_info, "version", None) or "—"
        thinking = getattr(model_info, "thinking", None)
        input_limit = getattr(model_info, "input_token_limit", None)
        output_limit = getattr(model_info, "output_token_limit", None)

        await message.reply_text(
            "Gemini API: OK\\n"
            f"Configured model: {MODEL_NAME}\\n"
            f"API model: {api_name}\\n"
            f"Display name: {display_name}\\n"
            f"Version: {version}\\n"
            f"Thinking supported: {thinking}\\n"
            f"Input token limit: {input_limit}\\n"
            f"Output token limit: {output_limit}"
        )

    except Exception as error:
        logging.exception(
            "Ошибка проверки версии Gemini: %s",
            error,
        )

        await message.reply_text(
            "Gemini API: ERROR\\n"
            f"Configured model: {MODEL_NAME}\\n"
            f"{type(error).__name__}: {error}"
        )


'''
          if 'async def gemini_version_command(' not in text:
              replace_once(marker, command + marker, 'gemini version command insertion')

          handler_marker = '''    application.add_handler(
        CommandHandler(
            "settings",
            settings_command,
        )
    )'''
          handler = '''    application.add_handler(
        CommandHandler(
            "geminiversion",
            gemini_version_command,
        )
    )
'''
          if '"geminiversion"' not in text:
              replace_once(handler_marker, handler + handler_marker, 'gemini version handler insertion')

          path.write_bytes(text.replace('\n', newline).encode('utf-8'))
          PY

      - name: Validate syntax
        run: python -m py_compile bot.py

      - name: Commit integrated changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-main-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py .github/workflows/apply-main-sync.yml
          git commit -m "Integrate Gemini 3.6 thinking and version command"
          git push origin HEAD:feature/rage-consistency-punches
