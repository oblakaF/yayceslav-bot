name: Temporary daily title scheduler validation

on:
  push:
    branches:
      - agent/daily-title-scheduler-status

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Apply patch
        run: python tools/patch_daily_title_scheduler.py

      - name: Compile
        run: |
          python -m py_compile bot.py daily_title_engine.py title_pools.py

      - name: Run full tests
        run: pytest -q

      - name: Commit validated runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py tests/test_daily_title_scheduler.py
          git diff --cached --check
          git commit -m "Make daily titles independent and observable"
          git push origin HEAD:agent/daily-title-scheduler-status
