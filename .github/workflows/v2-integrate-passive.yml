name: Integrate V2 passive drops and fatigue

on:
  push:
    branches:
      - feature/human-yayceslav-v2

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Integrate V2 passive drops and fatigue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-yayceslav-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch passive runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("bot.py")
          text = p.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "import intent\nimport reaction_engine\n",
              "import intent\nimport passive_engine\nimport reaction_engine\n",
              "passive import",
          )

          replace_once(
              '''        voice_material = voice_runtime.choose_voice_material(\n            voice_pack,\n            conversation_mode=conversation_mode,\n            roughness=str(settings.get("roughness", "medium")),\n            serious_topic=(conversation_mode == "serious"),\n        )\n        current_instruction += style_engine.build_length_instruction(length_plan)\n        current_instruction += voice_runtime.build_voice_instruction(voice_material)\n''',
              '''        voice_material = voice_runtime.choose_voice_material(\n            voice_pack,\n            conversation_mode=conversation_mode,\n            roughness=str(settings.get("roughness", "medium")),\n            serious_topic=(conversation_mode == "serious"),\n        )\n        current_instruction += style_engine.build_length_instruction(length_plan)\n        current_instruction += voice_runtime.build_voice_instruction(voice_material)\n\n        if (\n            bot_was_mentioned\n            and chat_type in ("group", "supergroup")\n            and chat_id is not None\n        ):\n            fatigue_decision = passive_engine.note_bot_call_and_maybe_fatigue(\n                chat_id,\n                pack_name=voice_pack,\n                serious_topic=(conversation_mode == "serious"),\n            )\n            fatigue_instruction = passive_engine.build_fatigue_instruction(\n                fatigue_decision\n            )\n            if fatigue_instruction:\n                current_instruction += fatigue_instruction\n''',
              "fatigue runtime",
          )

          replace_once(
              '''    # --------------------------------------------------------\n    # 3. Редкое случайное вмешательство\n    #\n    # Реакция и текстовая реплика на одно и то же сообщение —\n    # это уже два вмешательства сразу, чего быть не должно.\n    # --------------------------------------------------------\n\n    last_random_reply = float(\n''',
              '''    # --------------------------------------------------------\n    # 3. Редкое случайное вмешательство\n    #\n    # Реакция и текстовая реплика на одно и то же сообщение —\n    # это уже два вмешательства сразу, чего быть не должно.\n    # V2 random drop не создаёт новый слот: он может только заменить\n    # содержимое уже разрешённой ниже random reply.\n    # --------------------------------------------------------\n\n    passive_engine.note_group_activity(chat_id)\n\n    last_random_reply = float(\n''',
              "group activity counter",
          )

          replace_once(
              '''    if (\n        not reacted_to_this_message\n        and now - last_random_reply >= HARD_RANDOM_REPLY_COOLDOWN\n        and random.random() < random_reply_chance\n        and group_random_reply_allowed(chat_id, now)\n    ):\n        await update.message.reply_text(\n            random.choice(\n                HARD_RANDOM_REPLIES\n            )\n        )\n\n        context.chat_data[\n            "hard_last_random_reply"\n        ] = now\n''',
              '''    if (\n        not reacted_to_this_message\n        and now - last_random_reply >= HARD_RANDOM_REPLY_COOLDOWN\n        and random.random() < random_reply_chance\n        and group_random_reply_allowed(chat_id, now)\n    ):\n        drop_decision = passive_engine.maybe_random_drop(\n            chat_id,\n            existing_random_reply_slot_open=True,\n            now=now,\n        )\n        random_reply_text = (\n            drop_decision.text\n            if drop_decision.active and drop_decision.text\n            else random.choice(HARD_RANDOM_REPLIES)\n        )\n        await update.message.reply_text(random_reply_text)\n\n        context.chat_data[\n            "hard_last_random_reply"\n        ] = now\n''',
              "styled random drop inside existing slot",
          )

          p.write_text(text, encoding="utf-8")

          Path("tests/test_v2_passive_runtime.py").write_text(
              '''import passive_engine\nimport bot\n\n\ndef test_build_instruction_can_add_same_pack_fatigue(monkeypatch):\n    passive_engine.reset_state()\n    monkeypatch.setattr(\n        bot.style_engine, "choose_voice_pack", lambda ctx: "blat"\n    )\n    monkeypatch.setattr(\n        bot.passive_engine,\n        "note_bot_call_and_maybe_fatigue",\n        lambda *args, **kwargs: passive_engine.FatigueDecision(\n            active=True,\n            pack_name="blat",\n            text="Опять весь этот кипиш мне разгребать.",\n            call_count=8,\n            reason="fatigue",\n        ),\n    )\n    instruction = bot.build_full_system_instruction(\n        "ну ответь", chat_id=881, chat_type="group", bot_was_mentioned=True\n    )\n    assert "V2 fatigue" in instruction\n    assert "Речевой пакет этого ответа: blat" in instruction\n    assert instruction.count("Речевой пакет этого ответа:") == 1\n\n\ndef test_private_chat_does_not_run_group_fatigue(monkeypatch):\n    def fail(*args, **kwargs):\n        raise AssertionError("fatigue should not run in private chat")\n    monkeypatch.setattr(bot.passive_engine, "note_bot_call_and_maybe_fatigue", fail)\n    bot.build_full_system_instruction(\n        "привет", chat_id=882, chat_type="private", bot_was_mentioned=True\n    )\n\n\ndef test_passive_drop_module_never_opens_extra_random_slot():\n    passive_engine.reset_state()\n    for _ in range(30):\n        passive_engine.note_group_activity(883)\n    decision = passive_engine.maybe_random_drop(\n        883, existing_random_reply_slot_open=False\n    )\n    assert not decision.active\n    assert decision.reason == "no_existing_slot"\n''',
              encoding="utf-8",
          )
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Validate
        run: |
          python -m py_compile bot.py passive_engine.py
          pytest -q
      - name: Commit tested code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py tests/test_v2_passive_runtime.py
          git commit -m "Wire V2 passive drops and fatigue"
          git push origin HEAD:feature/human-yayceslav-v2
